# Corpo do server da API (incluído em conf.d/atlas.conf). $api_upstream é a cor ativa.

ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;

# quem não vem pelo Cloudflare não fala com a API
if ($from_cf = 0) { return 444; }

# Authenticated Origin Pulls (opcional): com deploy/certs/aop.conf presente, só passa quem apresenta o certificado
# de cliente do Cloudflare. Sem o arquivo nada muda. Como ligar: deploy/README.md. A própria máquina passa sem
# certificado: é o deploy conferindo a API por dentro do contêiner.
set $atlas_aop 0;
include /etc/nginx/certs/aop*.conf;
set $atlas_aop_check "$atlas_aop:$from_local:$ssl_client_verify";
if ($atlas_aop_check ~ "^1:0:(?!SUCCESS$)") { return 444; }

include /etc/nginx/snippets/headers.conf;

client_max_body_size 2m;
gzip on;
gzip_types application/json text/csv text/plain;

location /api/ {
  limit_req zone=atlas_ai burst=20 nodelay;
  limit_req zone=atlas_ai_all burst=100 nodelay;
  limit_req zone=atlas_thermal burst=30 nodelay;
  limit_req zone=atlas_heavy burst=100 nodelay;
  limit_req_status 429;
  limit_conn atlas_conn 100;
  limit_conn_status 429;
  proxy_pass $api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 180s;   # /api/ask pode demorar (o Cloudflare corta em 100 s)
  proxy_send_timeout 180s;
  # qual build atende (blue ou green): dá para ver de fora com curl -I
  add_header X-Atlas-Api $atlas_build always;
  include /etc/nginx/snippets/headers.conf;
  # API fora do ar ou ainda subindo: JSON com a causa e com CORS, nunca uma página HTML (o front mostra a mensagem)
  error_page 502 504 = @api_down;
  error_page 429 = @rate_limited;
}

location @rate_limited {
  default_type application/json;
  add_header Access-Control-Allow-Origin * always;
  add_header Retry-After 30 always;
  include /etc/nginx/snippets/headers.conf;
  return 429 '{"error":"Too many requests in a short time. Wait a few seconds and try again."}';
}

location @api_down {
  default_type application/json;
  add_header Access-Control-Allow-Origin * always;
  add_header Retry-After 5 always;
  include /etc/nginx/snippets/headers.conf;
  return 503 '{"error":"The Atlas API is restarting. Try again in a few seconds."}';
}

location = /healthz { access_log off; return 200 "ok\n"; }
location / { return 404; }
