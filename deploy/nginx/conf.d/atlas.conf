# nginx na frente da API do Atlas (api.atlas-stars-beyond.tech). Só 443 e só tráfego do Cloudflare
# (nuvem laranja, SSL "Full"). HTTP vira HTTPS no próprio Cloudflare ("Always Use HTTPS").
# TLS entre Cloudflare e a VPS: certificado em deploy/certs (Origin Certificate do Cloudflare,
# ou o autoassinado que o bootstrap gera até você trocar).
#
# Esta pasta (conf.d) e a snippets são montadas inteiras no contêiner (deploy/compose.prod.yml): o que muda no git
# vale no próximo `nginx -s reload`. Arquivo montado um a um ficava preso à versão antiga depois de um git reset.

server_tokens off;

include /etc/nginx/snippets/cloudflare.conf;

# resolve o nome da API pelo DNS do Docker na hora do pedido: o nginx sobe mesmo se a API ainda estiver subindo
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---------------------------------------------------------------- limites de pedidos
# O IP é o do visitante (CF-Connecting-IP, ver snippets/cloudflare.conf). Chave vazia = pedido que não conta.
#
# 1) Rotas que chamam modelos pagos (Claude, OpenAI, RAG), por IP: 30/min com rajada de 20 cobre o uso normal,
#    inclusive a busca da home, que interpreta o texto enquanto a pessoa digita.
map $uri $atlas_ai_client {
  ~^/api/(ask|ask/stream|scenario/infer)$ $binary_remote_addr;
  default "";
}
limit_req_zone $atlas_ai_client zone=atlas_ai:10m rate=30r/m;

# 2) As mesmas rotas, somando todos os visitantes: 300/min (5 por segundo) com rajada de 100. É o teto de quanto
#    um ataque espalhado por muitos IPs consegue gastar; o uso real de um evento fica muito abaixo disso. O limite
#    de gasto de verdade é o que se configura na conta da Anthropic e da OpenAI.
map $uri $atlas_ai_all {
  ~^/api/(ask|ask/stream|scenario/infer)$ 1;
  default "";
}
limit_req_zone $atlas_ai_all zone=atlas_ai_all:1m rate=300r/m;

# 3) A câmera térmica roda redes neurais a cada ar novo (alguns segundos de CPU), por IP: 3 por segundo, rajada de 30.
map $uri $atlas_thermal_client {
  ~^/api/predict/thermal$ $binary_remote_addr;
  default "";
}
limit_req_zone $atlas_thermal_client zone=atlas_thermal:10m rate=3r/s;

# 4) Outras rotas que gastam CPU (embeddings, busca vetorial, simulação de missão), por IP: 20 por segundo, rajada
#    de 100. A tela dispara algumas delas a cada ajuste de cenário, e uma sala inteira pode sair pelo mesmo IP;
#    um laço de centenas de pedidos por segundo não passa.
map $uri $atlas_heavy_client {
  ~^/api/(search|rank|next-tests|graph|missions/simulations)$ $binary_remote_addr;
  default "";
}
limit_req_zone $atlas_heavy_client zone=atlas_heavy:10m rate=20r/s;

# 5) Pedidos simultâneos por IP (uma resposta em streaming segura um por até 3 min).
limit_conn_zone $binary_remote_addr zone=atlas_conn:10m;

# Qual cor da API atende: só o nome (blue ou green), nunca o endereço interno.
map $api_upstream $atlas_build {
  ~api-(?<color>blue|green) $color;
  default api;
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  # Para onde vai o tráfego: a cor ativa (api-blue ou api-green), que o deploy escreve em /etc/nginx/active/api.conf.
  # Sem esse arquivo, a API do esquema antigo ("api"): é o que mantém a produção no ar durante a migração.
  set $api_upstream http://api:8787;
  include /etc/nginx/active/*.conf;

  include /etc/nginx/snippets/common.conf;
}
